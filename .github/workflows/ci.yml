name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myna
          POSTGRES_PASSWORD: myna
          POSTGRES_DB: myna_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U myna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://myna:myna@localhost:5432/myna_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (shared, server, mobile)
        run: npm run typecheck
      - name: Tests (shared unit + server integration on PostgreSQL)
        run: npm test
